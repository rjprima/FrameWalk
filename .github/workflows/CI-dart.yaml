name: validate dart code

on: 
  push:
    paths:
      - 'frame_walk/lib/**'
      - 'frame_walk/test/**'
      - 'frame_walk/pubspec.yaml'
      - 'frame_walk/pubspec.lock'
      - 'frame_walk/analysis_options.yaml'
      - '.github/workflows/CI-dart.yaml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup linter 
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
        working-directory: frame_walk

      - name: Lint
        run: flutter analyze
        working-directory: frame_walk

      - name: Run tests
        run: flutter test
        working-directory: frame_walk
